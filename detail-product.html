<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品の音源 - 詳細</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: #eee;
      font-family: "Hiragino Sans", "Yu Gothic", "MS Gothic", sans-serif;
      line-height: 1.8;
      padding: 40px 20px;
    }
    .container { max-width: 720px; margin: 0 auto; }
    a.back {
      display: inline-block;
      color: #ffff00;
      text-decoration: none;
      margin-bottom: 30px;
      font-size: 16px;
    }
    a.back:hover { text-decoration: underline; }
    .card {
      background: #1a1a1a;
      border: 2px solid #444;
      padding: 24px;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    h1 { font-size: 26px; margin-bottom: 12px; }
    h2 { font-size: 20px; margin-bottom: 12px; color: #ffff99; }
    .tachi {
      max-width: 280px;
      width: 100%;
      display: block;
      margin: 0 auto 20px;
      border-radius: 6px;
    }
    .download-btn {
      display: inline-block;
      background: #ffff00;
      color: #000;
      padding: 12px 28px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
      margin-top: 10px;
    }
    .download-btn:hover { background: #fff; }
    audio { width: 100%; margin-top: 10px; }
    ul { padding-left: 1.4em; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← 店に戻る</a>

    <div class="card">
      <img src="images/stand-product.png" alt="商品の立ち絵" class="tachi">
      <h1>赤倉龍輝</h1>
      <p>龍の少年。意外とお調子者。</p>
    </div>

    <div class="card">
      <h2>試聴</h2>
      <audio controls src="samples/product-demo.mp3">
        お使いのブラウザは音声再生に対応していません。
      </audio>
    </div>

    <div class="card">
      <h2>ダウンロード</h2>
      <p>利用規約を確認の上、ご利用ください。</p>
      <a href="https://www.dropbox.com/scl/fi/r007ff4nlva1wzagb0o6p/.zip?rlkey=ks2h0u1264roji05g4oes7sf4&st=e7msv6kg&dl=1" class="download-btn" target="_blank" rel="noopener">
        最新版をダウンロード
      </a>
    </div>

    <div class="card">
      <h2>音源情報</h2>
      <ul>
        <li>形式：単独音(母音連続音)</li>
        <li>音階：G3</li>
        <li>推奨エンジン：-</li>
      </ul>
    </div>
  </div>
</body>
</html>
