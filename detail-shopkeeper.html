<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店主の音源 - 詳細</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: #eee;
      font-family: "Hiragino Sans", "Yu Gothic", "MS Gothic", sans-serif;
      line-height: 1.8;
      padding: 40px 20px;
    }
    .container { max-width: 720px; margin: 0 auto; }
    a.back {
      display: inline-block;
      color: #ffff00;
      text-decoration: none;
      margin-bottom: 30px;
      font-size: 16px;
    }
    a.back:hover { text-decoration: underline; }
    .card {
      background: #1a1a1a;
      border: 2px solid #444;
      padding: 24px;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    h1 { font-size: 26px; margin-bottom: 12px; }
    h2 { font-size: 20px; margin-bottom: 12px; color: #ffff99; }
    .tachi {
      max-width: 280px;
      width: 100%;
      display: block;
      margin: 0 auto 20px;
      border-radius: 6px;
    }
    .download-btn, .video-btn {
      display: inline-block;
      padding: 12px 28px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
      margin: 8px 8px 0 0;
    }
    .download-btn {
      background: #ffff00;
      color: #000;
    }
    .download-btn:hover { background: #fff; }
    .video-btn {
      background: #ff4444;
      color: #fff;
    }
    .video-btn:hover { background: #ff6666; }
    audio { width: 100%; margin-top: 10px; }
    ul { padding-left: 1.4em; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← 店に戻る</a>

    <div class="card">
      <img src="images/stand-shopkeeper.png" alt="店主の立ち絵" class="tachi">
      <h1>妖火クロ</h1>
      <p>宵狐堂の店主。マイペース。</p>
    </div>

    <div class="card">
      <h2>試聴</h2>
      <audio controls src="samples/shopkeeper-demo.mp3">
        お使いのブラウザは音声再生に対応していません。
      </audio>
    </div>

    <div class="card">
      <h2>ダウンロード・配布動画</h2>
      <p>利用規約を確認の上、ご利用ください。</p>
      <a href="https://www.dropbox.com/scl/fi/y4wu1rs2gu0re0cya1hs0/.zip?rlkey=u0ce9cgwadjxba7q49vmpx2ko&st=1z668yh6&dl=1
" class="download-btn" target="_blank" rel="noopener">
        最新版をダウンロード
      </a>
      <!-- ↓ ここを実際の配布動画URLに書き換えてください -->
      <a href="https://www.nicovideo.jp/watch/smXXXXXXXX" class="video-btn" target="_blank" rel="noopener">
        配布動画を見る
      </a>
    </div>

    <div class="card">
      <h2>音源情報</h2>
      <ul>
        <li>形式：連続音</li>
        <li>音階：C3</li>
        <li>推奨エンジン：-</li>
      </ul>
    </div>
  </div>
</body>
</html>
